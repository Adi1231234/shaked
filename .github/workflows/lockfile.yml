name: Regenerate the lockfile on linux

# npm omits the dependency subtree of optional packages that do not match the
# host platform, so a lockfile resolved on Windows is incomplete for the ubuntu
# runner. Run this by hand when that happens and commit the artifact it
# produces. Temporary - delete once the lockfile is healthy.
on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --package-lock-only --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
