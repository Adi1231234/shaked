<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060d" />
<title>שקד · גפיים 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --bg-0:#03050b;
    --ink:#e9f1ff;
    --ink-dim:#aab7d4;
    --ink-soft:#6b7a9a;
    --cyan:#7ee8ff;
    --cyan-deep:#3aa6ff;
    --rose:#ff5f8f;
    --rose-soft:#ff9bbf;
    --gold:#ffe6b3;
    --green:#5fffb0;
    --bone:#f3e9d1;
    --muscle:#d04060;
    --vein:#5a8fff;
  }
  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(126,232,255,0.08), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(255,95,143,0.10), transparent 60%),
      radial-gradient(140% 90% at 50% 0%, #0a1430 0%, #04070f 55%, #02030a 100%);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  /* Boot loader: cover entire UI until first GLB ready */
  .boot {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 50%, #060a18 0%, #03050b 70%);
    transition: opacity .8s ease, visibility .8s;
  }
  body.loaded .boot { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot-rings {
    position: relative;
    width: 160px; height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .boot-rings .ring {
    position: absolute;
    border: 1.5px solid;
    border-radius: 50%;
    width: 50px; height: 50px;
    animation: ring-expand 2.4s ease-out infinite;
    opacity: 0;
  }
  .boot-rings .ring.r1 { border-color: rgba(126,232,255,0.6); animation-delay: 0s; }
  .boot-rings .ring.r2 { border-color: rgba(255,155,191,0.55); animation-delay: 0.8s; }
  .boot-rings .ring.r3 { border-color: rgba(255,230,179,0.45); animation-delay: 1.6s; }
  @keyframes ring-expand {
    0%   { transform: scale(0.5); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .boot-heart {
    font-size: 44px;
    filter: drop-shadow(0 0 22px rgba(255,95,143,0.6));
    animation: heart-pulse 1.6s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes heart-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Hide app contents until loaded */
  body:not(.loaded) #app { opacity: 0; }
  #app { transition: opacity 0.6s ease 0.1s; }

  header {
    padding: max(env(safe-area-inset-top), 12px) 16px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .greeting { display: flex; flex-direction: column; line-height: 1.15; text-decoration: none; color: inherit; cursor: pointer; }
  .greeting:hover .hi { color: var(--cyan); }
  .greeting .hi { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; transition: color .2s; }
  .greeting .name {
    font-weight: 800;
    font-size: 21px;
    background: linear-gradient(120deg, var(--cyan), var(--rose-soft) 60%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .exam-progress {
    font-size: 13px;
    color: var(--ink-dim);
    background: rgba(126,232,255,0.06);
    border: 1px solid rgba(126,232,255,0.18);
    border-radius: 999px;
    padding: 6px 12px;
    gap: 6px;
    align-items: center;
    display: none;
  }
  body.mode-quiz .exam-progress { display: inline-flex; }
  body.mode-practice .exam-progress-total { display: none; }
  body.mode-practice .exam-progress-slash { display: none; }
  .exam-progress b { color: var(--cyan); font-weight: 700; }
  .exam-progress-sep { opacity: 0.5; }

  .header-btn {
    background: rgba(126,232,255,0.06);
    border: 1px solid rgba(126,232,255,0.18);
    color: var(--cyan);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .header-btn:hover { background: rgba(126,232,255,0.12); border-color: rgba(126,232,255,0.32); }
  .back-to-overview {
    background: rgba(255,95,143,0.10);
    border-color: rgba(255,95,143,0.3);
    color: var(--rose-soft);
    display: none;
  }
  .back-to-overview:hover { background: rgba(255,95,143,0.18); border-color: rgba(255,95,143,0.45); }
  body.mode-quiz #header-history { display: none; }
  body.mode-quiz #back-home { display: none; }
  body.mode-quiz .back-to-overview { display: inline-flex; align-items: center; }

  /* ===== Screens ===== */
  .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  /* Hide controls bar entirely during quiz/practice for full-screen 3D. */
  body.mode-quiz .main-controls { display: none; }
  .main-controls { display: flex; flex-direction: column; gap: 0; }

  /* ===== Main tabs (חקירה / תרגול / מבחן) ===== */
  nav.main-tabs {
    display: flex;
    gap: 4px;
    margin: 4px 16px 8px;
    padding: 3px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
  }
  .m-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s ease;
  }
  .m-tab:hover { color: var(--ink-dim); }
  .m-tab.active {
    background: linear-gradient(135deg, rgba(126,232,255,0.16), rgba(255,95,143,0.10));
    color: var(--ink);
    box-shadow: 0 4px 14px -8px rgba(126,232,255,0.5);
  }

  /* ===== Tab-specific actions (only visible on matching panel) ===== */
  .tab-actions { display: none; padding: 4px 16px 8px; }
  body.panel-practice .tab-actions[data-panel="practice"] { display: block; }
  body.panel-exam .tab-actions[data-panel="exam"] { display: block; }
  /* Search box only relevant in overview (free explore) — hidden in practice/exam tab. */
  body.panel-practice .search-wrap,
  body.panel-exam .search-wrap { display: none; }

  .exam-actions-row { display: flex; gap: 8px; align-items: stretch; }
  .exam-actions-row .start-btn { flex: 1; }
  .exam-history-btn {
    padding: 0 14px;
    white-space: nowrap;
    align-self: stretch;
    display: flex; align-items: center;
  }

  /* ===== Start exam / practice buttons ===== */
  .start-btn, .practice-btn {
    width: 100%;
    border-radius: 14px;
    padding: 12px 14px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .start-btn {
    background: linear-gradient(135deg, var(--rose) 0%, var(--cyan-deep) 100%);
    border: none;
    color: #04060d;
    box-shadow: 0 8px 22px -12px rgba(255,95,143,0.5);
  }
  .practice-btn {
    background: rgba(126,232,255,0.08);
    border: 1px solid rgba(126,232,255,0.32);
    color: var(--cyan);
  }
  .practice-btn:hover { background: rgba(126,232,255,0.14); border-color: rgba(126,232,255,0.5); }
  .start-btn:disabled, .practice-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .start-btn:not(:disabled):active, .practice-btn:not(:disabled):active { transform: translateY(1px); }
  .start-btn-main { font-size: 14px; }
  .start-btn-sub { font-size: 10px; opacity: 0.75; font-weight: 500; }

  .learn-link {
    background: transparent;
    border: 1px solid rgba(126,232,255,0.18);
    color: var(--ink-dim);
    border-radius: 12px;
    padding: 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s ease;
    width: 100%;
  }
  .learn-link:hover { color: var(--cyan); border-color: rgba(126,232,255,0.35); }
  .results-btn { width: 100%; }

  /* ===== Tabs (limb selector) ===== */
  nav.tabs { display: flex; gap: 6px; padding: 4px 16px 6px; }
  .tab {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--ink-dim);
    border-radius: 12px;
    padding: 8px 12px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all .25s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(126,232,255,0.14), rgba(58,166,255,0.10));
    border-color: rgba(126,232,255,0.35);
    color: var(--ink);
    box-shadow: 0 6px 20px -10px rgba(126,232,255,0.5);
  }

  /* ===== History list (used inside history overlay) ===== */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 60vh;
    overflow-y: auto;
    margin: 12px 0 16px;
    padding-left: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(126,232,255,0.35) transparent;
  }
  .history-empty {
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    padding: 18px 8px;
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .history-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: right;
    transition: background .15s ease, border-color .15s ease;
  }
  .history-item:hover { background: rgba(126,232,255,0.06); border-color: rgba(126,232,255,0.2); }
  .history-item .h-score { font-weight: 700; font-size: 16px; color: var(--cyan); min-width: 50px; }
  .history-item .h-mid { flex: 1; min-width: 0; }
  .history-item .h-topics { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .h-date { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .history-item .h-arrow { color: var(--ink-soft); font-size: 14px; }
  .history-item.high .h-score { color: var(--green); }
  .history-item.low .h-score { color: var(--rose-soft); }

  .row { display: flex; gap: 6px; padding: 4px 16px 6px; }
  .seg-btn {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 6px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg-btn .swatch {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .seg-btn.layer-bones.on { color: var(--bone); border-color: rgba(243,233,209,0.35); background: rgba(243,233,209,0.08); }
  .seg-btn.layer-muscles.on { color: var(--rose-soft); border-color: rgba(255,155,191,0.4); background: rgba(208,64,96,0.10); }
  .seg-btn.layer-veins.on { color: var(--vein); border-color: rgba(90,143,255,0.4); background: rgba(90,143,255,0.10); }
  .seg-btn.on .swatch { opacity: 1; box-shadow: 0 0 8px currentColor; }

  .stage {
    flex: 1;
    position: relative;
    margin: 0 12px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(126,232,255,0.10);
    background:
      radial-gradient(80% 60% at 50% 30%, rgba(126,232,255,0.05), transparent 70%),
      linear-gradient(180deg, #060a17 0%, #03050b 100%);
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
    touch-action: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 14px;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .loader.hide { opacity: 0; }
  .pulse {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(126,232,255,0.6), transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
    margin-inline-end: 12px;
  }
  @keyframes pulse {
    0%,100% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  .hint {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 6;
    text-align: right;
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    pointer-events: none;
    opacity: 0.85;
    list-style: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
    text-shadow: 0 0 8px rgba(3, 5, 11, 0.9);
  }
  .hint li {
    list-style: none;
    display: block;
  }
  .hint li::before {
    content: "·  ";
    color: var(--cyan);
    opacity: 0.85;
  }
  body.mode-quiz .hint { top: 64px; }
  .hint.hide {
    opacity: 0;
    transform: translateY(-4px);
  }

  .reset-btn {
    position: absolute;
    bottom: 8px; left: 8px;
    width: 36px; height: 36px;
    background: rgba(126,232,255,0.10);
    border: 1px solid rgba(126,232,255,0.32);
    color: var(--cyan);
    border-radius: 50%;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s ease, border-color .2s ease, transform .35s ease;
    z-index: 5;
    box-shadow: 0 4px 14px -8px rgba(0,0,0,0.6);
  }
  .reset-btn:hover { background: rgba(126,232,255,0.18); border-color: rgba(126,232,255,0.5); transform: rotate(-90deg); }
  .reset-btn:active { transform: rotate(-180deg); }

  .quiz-prompt {
    position: absolute;
    top: 10px; right: 10px; left: 10px;
    background: rgba(7,11,28,0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,95,143,0.25);
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    font-size: 14px;
    display: none;
  }
  body.mode-quiz .quiz-prompt { display: block; }
  .quiz-prompt .ask { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.05em; }
  .quiz-prompt .target { color: var(--rose-soft); font-weight: 500; font-size: 16px; margin-top: 1px; }
  .quiz-prompt .target em { font-style: normal; color: var(--ink); font-size: 13px; opacity: 0.85; }

  /* Search box + dropdown */
  .search-wrap {
    position: relative;
    margin: 0 16px 6px;
  }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(126,232,255,0.18);
    border-radius: 12px;
    padding: 10px 14px 10px 36px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .search-input::placeholder { color: var(--ink-soft); }
  .search-input:focus {
    border-color: rgba(126,232,255,0.5);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(126,232,255,0.12);
  }
  .search-icon {
    position: absolute;
    top: 50%; left: 12px;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border: 1.6px solid var(--ink-soft);
    border-radius: 50%;
    pointer-events: none;
    transition: opacity .15s ease;
  }
  .search-icon::after {
    content: '';
    position: absolute;
    bottom: -5px; right: -5px;
    width: 7px; height: 1.6px;
    background: var(--ink-soft);
    transform: rotate(45deg);
    border-radius: 1px;
  }
  .search-wrap.has-text .search-icon { opacity: 0; }
  .search-clear {
    position: absolute;
    top: 50%; left: 5px;
    transform: translateY(-50%);
    width: 26px; height: 26px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 50%;
    color: var(--ink-dim);
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .search-clear:hover {
    background: rgba(255,95,143,0.14);
    color: var(--rose-soft);
    transform: translateY(-50%) scale(1.05);
  }
  .search-wrap.has-text .search-clear { display: flex; }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    z-index: 20;
    background: rgba(7,11,28,0.96);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(126,232,255,0.22);
    border-radius: 12px;
    padding: 4px;
    max-height: 280px;
    overflow-y: auto;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.7);
    display: none;
    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: rgba(126,232,255,0.35) transparent;
  }
  /* WebKit / Chromium */
  .search-dropdown::-webkit-scrollbar {
    width: 8px;
  }
  .search-dropdown::-webkit-scrollbar-track {
    background: transparent;
    margin: 6px 0;
  }
  .search-dropdown::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(126,232,255,0.35), rgba(255,155,191,0.30));
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .search-dropdown::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(126,232,255,0.6), rgba(255,155,191,0.5));
    background-clip: padding-box;
    border: 2px solid transparent;
  }
  .search-wrap.open .search-dropdown { display: block; }
  .search-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .search-item:hover, .search-item.active {
    background: rgba(126,232,255,0.10);
  }
  .search-item .layer-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .search-item.layer-Bones .layer-pip { background: var(--bone); color: var(--bone); }
  .search-item.layer-Muscles .layer-pip { background: var(--rose-soft); color: var(--rose-soft); }
  .search-item.layer-Veins .layer-pip { background: var(--vein); color: var(--vein); }
  .search-item .item-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    line-height: 1.2;
    overflow: hidden;
  }
  .search-item .item-primary {
    font-size: 14px;
    color: var(--ink);
    direction: ltr;
    text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-item .item-secondary {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-item mark {
    background: rgba(126,232,255,0.22);
    color: var(--cyan);
    padding: 0 2px;
    border-radius: 3px;
  }
  .search-empty {
    padding: 14px 12px;
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
  }

  .feedback {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    transition: box-shadow .3s ease;
  }
  .feedback.correct { box-shadow: inset 0 0 0 3px var(--green), inset 0 0 80px rgba(95,255,176,0.2); }
  .feedback.wrong { box-shadow: inset 0 0 0 3px var(--rose), inset 0 0 80px rgba(255,95,143,0.2); }

  .info {
    margin: 8px 12px max(env(safe-area-inset-bottom), 10px);
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(126,232,255,0.06), rgba(255,95,143,0.04));
    border: 1px solid rgba(126,232,255,0.15);
    border-radius: 16px;
    height: 116px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
    transition: border-color .3s ease, background .3s ease;
  }
  .info.empty { opacity: 0.6; }
  .info-dot {
    width: 12px; height: 12px;
    border-radius: 50%;

function infoFor(nodeName, layer) {
  const s = STRUCTURES[nodeName];
  if (s) return { heb: s.heb, lat: s.lat, desc: s.desc, layer };
  // Fallback: nodeName without trailing .r, prefer Latin display only
  const lat = nodeName.replace(/\.r$/, '').replace(/_/g, ' ');
  return { heb: '', lat, desc: '', layer };
}

async function loadLimb(name) {
  if (currentRoot) { scene.remove(currentRoot); currentRoot = null; }
  pickables = [];
  layerNodes = {};
  selected = null;
  loader.classList.remove('hide');

  let gltf = cache[name];
  if (!gltf) {
    gltf = await gltfLoader.loadAsync(`./models/${name}.glb`);
    cache[name] = gltf;
  }
  currentRoot = gltf.scene.clone(true);

  // Identify the three top-level layer groups by name
  for (const child of currentRoot.children) {
    if (LAYER_COLORS[child.name]) layerNodes[child.name] = child;
  }

  // Walk every mesh, give it a per-mesh material and tag with layer + node identity
  for (const [layerName, layerNode] of Object.entries(layerNodes)) {
    const lc = LAYER_COLORS[layerName];
    layerNode.traverse((obj) => {
      if (!obj.isMesh) return;

      // Identify this mesh's bone/muscle/vein name
      let nodeName = null;
      for (let n = obj; n && n !== layerNode; n = n.parent) {
        const orig = SANITIZED_TO_ORIG[n.name];
        if (orig) { nodeName = orig; break; }
      }
      if (!nodeName) {
        // No dictionary entry: still pickable, derive name from sanitized parent
        let n = obj;
        while (n && n !== layerNode && !n.name) n = n.parent;
        nodeName = n?.name || obj.name || 'unknown';
      }

      // Per-mesh material so highlighting is local
      obj.material = obj.material.clone();
      obj.material.color = new THREE.Color(lc.color);
      if ('roughness' in obj.material) obj.material.roughness = lc.roughness;
      if ('metalness' in obj.material) obj.material.metalness = lc.metalness;
      obj.material.transparent = lc.opacity < 1;
      obj.material.opacity = lc.opacity;
      obj.material.depthWrite = lc.opacity >= 0.99;
      obj.material.emissive = new THREE.Color(0x000000);

      // Compute approximate size (max bbox dim in world space) for pick priority.
      // Tiny meshes (landmark hotspots) win over big ones (whole bones) when both
      // are hit during fuzzy picking.
      if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
      const bbSize = obj.geometry.boundingBox.getSize(new THREE.Vector3());
      const meshSize = Math.max(bbSize.x, bbSize.y, bbSize.z);
      // Heuristic: small landmark hotspots are <40mm; bones are usually >50mm.
      const isHotspot = meshSize > 0 && meshSize < 0.04;

      // Hotspots (landmark markers) get a custom rose tint so they read as
      // "click me" pins rather than disconnected anatomy.
      if (isHotspot && layerName === 'Bones') {
        obj.material.color = new THREE.Color(0xff8fb5);
        obj.material.emissive = new THREE.Color(0x802040);
        obj.material.emissiveIntensity = 0.35;
        obj.material.roughness = 0.3;
      }

      pickables.push({
        mesh: obj,
        nodeName,
        layer: layerName,
        info: infoFor(nodeName, layerName),
        originalEmissive: obj.material.emissive.clone(),
        isHotspot,
      });
    });
  }

  scene.add(currentRoot);
  applyLayerVisibility();
  frameModel(currentRoot);
  loader.classList.add('hide');
  reveal();
  setInfoEmpty();
}

const bootStart = performance.now();
const MIN_BOOT_MS = 700;
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  const wait = Math.max(0, MIN_BOOT_MS - (performance.now() - bootStart));
  setTimeout(() => document.body.classList.add('loaded'), wait);
}

let initialView = null;
function computeVisibleBox(root) {
  const box = new THREE.Box3();
  const tmpBox = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    for (let p = o.parent; p; p = p.parent) { if (!p.visible) return; }
    if (!o.geometry?.boundingBox) o.geometry?.computeBoundingBox();
    if (!o.geometry?.boundingBox) return;
    tmpBox.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
    box.union(tmpBox);
  });
  if (box.isEmpty()) box.setFromObject(root);
  return box;
}
function frameModel(root) {
  // Make sure camera aspect reflects the current canvas size before fitting.
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w && h) { camera.aspect = w / h; camera.updateProjectionMatrix(); }

  const box = computeVisibleBox(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const aspect = camera.aspect || 1;
  const distForHeight = (size.y / 2) / Math.tan(vfov / 2);
  const distForWidth  = (size.x / 2) / Math.tan(vfov / 2) / aspect;
  const dist = Math.max(distForHeight, distForWidth) * 1.2;
  camera.position.set(0, 0, dist);
  controls.target.set(0, 0, 0);
  controls.update();
  initialView = {
    rootPos: root.position.clone(),
    rootQuat: root.quaternion.clone(),
    camPos: camera.position.clone(),
    target: controls.target.clone(),
  };
}

function resetView() {
  if (!initialView || !currentRoot) return;
  currentRoot.position.copy(initialView.rootPos);
  currentRoot.quaternion.copy(initialView.rootQuat);
  camera.position.copy(initialView.camPos);
  controls.target.copy(initialView.target);
  controls.update();
}

function clearSelection() {
  if (!selected) return;
  selected.mesh.material.emissive.copy(selected.originalEmissive);
  selected.mesh.material.emissiveIntensity = 1;
  selected = null;
}
function setSelection(p, color = SELECT_COLOR) {
  clearSelection();
  selected = p;
  p.mesh.material.emissive.copy(color);
  p.mesh.material.emissiveIntensity = 0.7;
}

// =====================================================================
// Picking — fuzzy raycast so a fat fingertip lands on thin bones.
// First try the exact tap point. If nothing is hit, fan out a ring of
// extra rays at ~22px radius and pick the nearest hit by 2D pixel
// distance from the original tap.
// =====================================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

const PICK_RADIUS_PX = 22;
const PICK_RING = (() => {
  // 1 center + 8 directions at 1x radius + 8 directions at 0.55x radius
  const out = [[0, 0]];
  const dirs = 8;
  for (const r of [1.0, 0.55]) {
    for (let i = 0; i < dirs; i++) {
      const a = (i / dirs) * Math.PI * 2;
      out.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
  }
  return out;
})();

function pickFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const visiblePickables = pickables.filter(p => layerNodes[p.layer]?.visible);
  if (!visiblePickables.length) return null;
  const visibleMeshes = visiblePickables.map(p => p.mesh);
  const meshToP = new Map(visiblePickables.map(p => [p.mesh, p]));

  let bestHotspot = null, bestHotspotPenalty = Infinity;
  let bestAny = null, bestAnyPenalty = Infinity;
  for (let i = 0; i < PICK_RING.length; i++) {
    const [ox, oy] = PICK_RING[i];
    const px = cx + ox * PICK_RADIUS_PX;
    const py = cy + oy * PICK_RADIUS_PX;
    const x = (px / rect.width) * 2 - 1;
    const y = -((py / rect.height) * 2 - 1);
    ndc.set(x, y);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(visibleMeshes, false);
    if (!hits.length) continue;
    const offsetPx2 = (ox * PICK_RADIUS_PX) ** 2 + (oy * PICK_RADIUS_PX) ** 2;

    // Among hits on this ray, prefer hotspot meshes over bulk meshes when both
    // are hit (so a sphere marker drawn on a bone surface still "wins").
    let rayPick = hits[0].object;
    for (const h of hits) {
      const p = meshToP.get(h.object);
      if (p?.isHotspot) { rayPick = h.object; break; }
    }
    const rayPickP = meshToP.get(rayPick);

    if (rayPickP?.isHotspot && offsetPx2 < bestHotspotPenalty) {
      bestHotspotPenalty = offsetPx2;
      bestHotspot = rayPick;
    }
    if (offsetPx2 < bestAnyPenalty) {
      bestAnyPenalty = offsetPx2;
      bestAny = rayPick;
    }
  }
  // Hotspots always win if any was hit anywhere in the fan, even if a bone hit
  // landed closer to center: tiny markers need this magnetism to be tappable.
  const winner = bestHotspot || bestAny;
  return winner ? meshToP.get(winner) || null : null;
}

let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (Math.hypot(dx, dy) > 12) return;
  const picked = pickFromEvent(e);
  if (!picked) {
    if (mode === 'learn') { clearSelection(); setInfoEmpty(); }
    return;
  }
  if (mode === 'learn') {
    setSelection(picked);
    showInfo(picked);
  } else {
    answerQuestion(picked);
  }
});

// =====================================================================
// Search box: type Hebrew or English to find and highlight a structure.
// =====================================================================
const searchWrap = document.getElementById('search-wrap');
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
const searchDropdown = document.getElementById('search-dropdown');
let searchResults = [];
let searchActiveIdx = 0;

function normalize(s) {
  // strip diacritics, lowercase, collapse spaces; keep Hebrew letters as-is.
  return (s || '')
    .toString()
    .normalize('NFKD')
    .replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();
}

function searchPool() {
  // One entry per *named* pickable; deduplicate so the dropdown shows each
  // structure once, not once per mesh fragment.
  const seen = new Map();
  for (const p of pickables) {
    if (!p.info?.lat) continue;
    const key = `${p.layer}::${p.nodeName}`;
    if (!seen.has(key)) seen.set(key, p);
  }
  return [...seen.values()];
}

function searchableText(p) {
  // English term from the model (e.g., "Adductor tubercle"), Latin display
  // name, and Hebrew label all count as match haystacks. Strip ".r"/".l" sides.
  const eng = (p.nodeName || '').replace(/\.[rl]$/, '').replace(/_/g, ' ');
  return {
    eng: normalize(eng),
    lat: normalize(p.info.lat),
    heb: normalize(p.info.heb),
  };
}

function scoreMatch(p, q) {
  if (!q) return 0;
  const t = searchableText(p);
  // Tokenize query — every token must hit *some* haystack. This lets users
  // search loose phrases like "adductor t" or "biceps long" without needing
  // exact prefixes.
  const tokens = q.split(/\s+/).filter(Boolean);
  let total = 0;
  for (const tok of tokens) {
    let best = 0;
    for (const h of [t.eng, t.lat, t.heb]) {
      if (!h) continue;
      if (h === tok) best = Math.max(best, 120);
      else if (h.startsWith(tok)) best = Math.max(best, 90);
      else {
        // Word-boundary boost (start of any word in the haystack).
        const re = new RegExp(`(^|\\s|-)${tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'u');
        if (re.test(h)) best = Math.max(best, 55);
        else if (h.includes(tok)) best = Math.max(best, 25);
      }
    }
    if (best === 0) return 0;  // a token failed to match anywhere — skip entry
    total += best;
  }
  // Penalize very long names so a focused short hit beats a sprawling name.
  return total - Math.min(t.lat.length, 60) / 20;
}

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = normalize(text).indexOf(q);
  if (idx < 0) return text;
  // Find original-case slice. Normalize is roughly 1:1 for our text.
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function renderDropdown(query, results) {
  if (!results.length) {
    searchDropdown.innerHTML = '<div class="search-empty">לא נמצא מבנה תואם</div>';
    return;
  }
  const q = normalize(query);
  searchDropdown.innerHTML = results.slice(0, 30).map((p, i) => `
    <div class="search-item layer-${p.layer} ${i === searchActiveIdx ? 'active' : ''}" data-idx="${i}" role="option">
      <div class="layer-pip"></div>
      <div class="item-text">
        <div class="item-primary">${highlightMatch(p.info.lat, q)}</div>
        <div class="item-secondary">${highlightMatch(p.info.heb || '', q)}</div>
      </div>
    </div>
  `).join('');
  // Wire up click handlers for the freshly rendered items
  for (const el of searchDropdown.querySelectorAll('.search-item')) {
    el.addEventListener('mouseenter', () => {
      searchActiveIdx = +el.dataset.idx;
      for (const e of searchDropdown.querySelectorAll('.search-item')) e.classList.toggle('active', e === el);
    });
    el.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      pickFromSearch(searchResults[+el.dataset.idx]);
    });
  }
}

function updateSearchResults() {
  const q = normalize(searchInput.value);
  searchWrap.classList.toggle('has-text', !!q);
  if (!q) {
    searchResults = [];
    searchWrap.classList.remove('open');
    return;
  }
  const pool = searchPool();
  const scored = [];
  for (const p of pool) {
    const s = scoreMatch(p, q);
    if (s > 0) scored.push({ p, s });
  }
  scored.sort((a, b) => b.s - a.s || a.p.info.lat.length - b.p.info.lat.length);
  searchResults = scored.map(x => x.p);
  searchActiveIdx = 0;
  searchWrap.classList.add('open');
  renderDropdown(q, searchResults);
}

function focusOn(p) {
  // Fly the orbit camera over so the picked mesh fills a comfortable area.
  if (!p.mesh.geometry.boundingBox) p.mesh.geometry.computeBoundingBox();
  const box = p.mesh.geometry.boundingBox.clone().applyMatrix4(p.mesh.matrixWorld);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  // Hotspots are tiny — pick a sensible minimum view radius so we don't zoom in
  // past the bone they sit on.
  const viewRadius = Math.max(radius, 0.04);
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (viewRadius / Math.tan(vfov / 2)) * 2.6;
  // Keep the current viewing direction; just slide along it to the new center.
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(center);
  camera.position.copy(center).add(dir.multiplyScalar(dist));
  controls.update();
}

function pickFromSearch(p) {
  if (!p) return;
  // Make sure the layer is on so the highlight is visible.
  if (!layerState[p.layer]) {
    layerState[p.layer] = true;
    document.querySelector(`.seg-btn[data-layer="${p.layer}"]`)?.classList.add('on');
    applyLayerVisibility();
  }
  setSelection(p);
  showInfo(p);
  focusOn(p);
  searchInput.value = p.info.lat;
  searchWrap.classList.remove('open');
  searchInput.blur();
}

searchInput.addEventListener('input', updateSearchResults);
searchInput.addEventListener('focus', () => { if (searchInput.value) updateSearchResults(); });
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!searchResults.length) return;
    searchActiveIdx = (searchActiveIdx + 1) % Math.min(searchResults.length, 30);
    renderDropdown(normalize(searchInput.value), searchResults);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!searchResults.length) return;
    searchActiveIdx = (searchActiveIdx - 1 + Math.min(searchResults.length, 30)) % Math.min(searchResults.length, 30);
    renderDropdown(normalize(searchInput.value), searchResults);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    pickFromSearch(searchResults[searchActiveIdx]);
  } else if (e.key === 'Escape') {
    searchWrap.classList.remove('open');
    searchInput.blur();
  }
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchWrap.classList.remove('has-text', 'open');
  searchInput.focus();
});
document.addEventListener('click', (e) => {
  if (!searchWrap.contains(e.target)) searchWrap.classList.remove('open');
});

// =====================================================================
// Mode state + exam flow + history
// =====================================================================
const QUESTIONS_PER_EXAM = 20;
const HISTORY_KEY = 'shaked-quiz-history-v1';

// 'learn' (default — explore + see names) | 'quiz' (active exam or practice)
let mode = 'learn';
let target = null;
let score = 0;

// Active exam (null when not running)
let exam = null;

// Layer toggles. In learn mode the user can toggle freely; an exam/practice
// snapshots whichever layers were active at the moment of "start".
const layerState = { Bones: true, Muscles: false, Veins: false };

const promptEl = document.getElementById('prompt');
const askEl = document.getElementById('ask');
const targetEl = document.getElementById('target');
const scoreNum = document.getElementById('score-num');
const qNumEl = document.getElementById('q-num');
const qTotalEl = document.getElementById('q-total');

function applyLayerVisibility() {
  for (const [name, node] of Object.entries(layerNodes)) {
    if (node) node.visible = layerState[name];
  }
}

function quizPool() {
  const visible = Object.keys(layerState).filter(l => layerState[l]);
  return pickables.filter(p => visible.includes(p.layer) && p.info.heb);
}
function askPrefix(layer) {
  return layer === 'Veins' ? 'איפה נמצא הוריד' : layer === 'Muscles' ? 'איפה נמצא השריר' : 'איפה נמצאת העצם';
}

function setMode(next) {
  mode = next;
  document.body.classList.toggle('mode-quiz', next === 'quiz');
}

// Active main tab: 'overview' | 'practice' | 'exam'.
let activeTab = 'overview';
function setActiveTab(name) {
  activeTab = name;
  for (const btn of document.querySelectorAll('.m-tab')) {
    btn.classList.toggle('active', btn.dataset.tab === name);
  }
  document.body.classList.toggle('panel-overview', name === 'overview');
  document.body.classList.toggle('panel-practice', name === 'practice');
  document.body.classList.toggle('panel-exam', name === 'exam');
}

// ===== Exam flow =====
function buildExamQuestions(limb, topics, limit = QUESTIONS_PER_EXAM) {
  const pool = pickables.filter(p => topics.includes(p.layer) && p.info.heb);
  // Deduplicate by structure name + layer (some structures have multiple meshes).
  const byKey = new Map();
  for (const p of pool) {
    const k = `${p.layer}::${p.nodeName}`;
    if (!byKey.has(k)) byKey.set(k, p);
  }
  const uniquePool = [...byKey.values()];
  // Shuffle (Fisher-Yates).
  for (let i = uniquePool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [uniquePool[i], uniquePool[j]] = [uniquePool[j], uniquePool[i]];
  }
  return Number.isFinite(limit) ? uniquePool.slice(0, limit) : uniquePool;
}

function startSession(kind) {
  const topics = Object.keys(layerState).filter(t => layerState[t]);
  if (!topics.length) return;

  setMode('quiz');
  document.body.classList.toggle('mode-practice', kind === 'practice');

  // Recompute camera fit because the controls bar just disappeared and the
  // stage grew taller.
  if (currentRoot) requestAnimationFrame(() => frameModel(currentRoot));

  const allQuestions = buildExamQuestions(currentLimb, topics, kind === 'practice' ? Infinity : QUESTIONS_PER_EXAM);
  exam = {
    kind,
    limb: currentLimb,
    topics: [...topics],
    questions: allQuestions,
    idx: 0,
    score: 0,
    mistakes: [],
    startedAt: Date.now(),
  };
  score = 0;
  scoreNum.textContent = '0';
  qTotalEl.textContent = String(allQuestions.length);
  presentExamQuestion();
}
function startExam() { return startSession('exam'); }
function startPractice() { return startSession('practice'); }

function presentExamQuestion() {
  clearSelection();
  if (!exam) return;
  if (exam.idx >= exam.questions.length) {
    if (exam.kind === 'practice') {
      // Reshuffle and keep going.
      for (let i = exam.questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [exam.questions[i], exam.questions[j]] = [exam.questions[j], exam.questions[i]];
      }
      exam.idx = 0;
    } else {
      finishExam();
      return;
    }
  }
  target = exam.questions[exam.idx];
  qNumEl.textContent = String(exam.idx + 1);
  askEl.textContent = askPrefix(target.layer);
  targetEl.innerHTML = `${target.info.lat} <em>· ${target.info.heb}</em>`;
  setInfoEmpty();
}

function finishExam() {
  if (!exam) return;
  const record = {
    id: exam.startedAt,
    date: exam.startedAt,
    limb: exam.limb,
    topics: exam.topics,
    score: exam.score,
    total: exam.questions.length,
    mistakes: exam.mistakes.map(m => ({
      correctNodeName: m.correct.nodeName,
      correctLayer: m.correct.layer,
      correctHeb: m.correct.info.heb,
      correctLat: m.correct.info.lat,
      pickedNodeName: m.picked ? m.picked.nodeName : null,
      pickedLayer: m.picked ? m.picked.layer : null,
      pickedHeb: m.picked ? m.picked.info.heb : null,
      pickedLat: m.picked ? m.picked.info.lat : null,
      skipped: !m.picked,
    })),
  };
  saveHistoryEntry(record);
  showResults(record);
  exam = null;
  target = null;
}

function flash(kind) {
  feedbackEl.classList.remove('correct','wrong');
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add(kind);
  setTimeout(() => feedbackEl.classList.remove(kind), 600);
}
function confettiBurst() {
  const emojis = ['💜','✨','💫','🦴','💖'];
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = (10 + Math.random()*80) + '%';
    el.style.top = (20 + Math.random()*30) + '%';
    el.style.setProperty('--dx', (Math.random()*120 - 60) + 'px');
    el.style.setProperty('--r', (Math.random()*900 - 450) + 'deg');
    el.style.animationDelay = (Math.random()*0.2) + 's';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

function answerQuestion(picked) {
  if (!target || !exam) return;
  if (picked === target) {
    exam.score++;
    score = exam.score;
    setSelection(picked, CORRECT_COLOR);
    showInfo(picked);
    flash('correct');
    confettiBurst();
    scoreNum.textContent = String(score);
    setTimeout(() => { exam.idx++; presentExamQuestion(); }, 1100);
  } else {
    exam.mistakes.push({ correct: target, picked });
    setSelection(picked, WRONG_COLOR);
    flash('wrong');
    setTimeout(() => {
      setSelection(target, CORRECT_COLOR);
      showInfo(target);
    }, 600);
    setTimeout(() => { exam.idx++; presentExamQuestion(); }, 1900);
  }
}

function skipQuestion() {
  if (mode !== 'quiz' || !exam || !target) return;
  exam.mistakes.push({ correct: target, picked: null });
  exam.idx++;
  presentExamQuestion();
}

// ===== History (localStorage) =====
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function saveHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
}
function saveHistoryEntry(rec) {
  const list = loadHistory();
  list.unshift(rec);
  // Keep last 50.
  saveHistory(list.slice(0, 50));
}

const TOPIC_HEB = { Bones: 'עצמות', Muscles: 'שרירים', Veins: 'ורידים' };
const LIMB_HEB  = { legs: 'רגל', arms: 'יד' };

function formatDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return `היום ${hh}:${mm}`;
  const dd = String(d.getDate()).padStart(2, '0');
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mo} ${hh}:${mm}`;
}

function renderHistory() {
  const list = loadHistory();
  const wrap = document.getElementById('history-list');
  const clearBtn = document.getElementById('history-clear');
  if (!list.length) {
    wrap.innerHTML = '<div class="history-empty">עוד אין מבחנים שמורים</div>';
    clearBtn.hidden = true;
    return;
  }
  clearBtn.hidden = false;
  wrap.innerHTML = list.map(rec => {
    const pct = rec.total ? Math.round((rec.score / rec.total) * 100) : 0;
    const cls = pct >= 85 ? 'high' : pct < 60 ? 'low' : '';
    const topics = rec.topics.map(t => TOPIC_HEB[t] || t).join(' · ');
    return `<div class="history-item ${cls}" data-id="${rec.id}">
      <div class="h-score">${rec.score}/${rec.total}</div>
      <div class="h-mid">
        <div class="h-topics">${LIMB_HEB[rec.limb] || rec.limb} · ${topics}</div>
        <div class="h-date">${formatDate(rec.date)}</div>
      </div>
      <div class="h-arrow">›</div>
    </div>`;
  }).join('');
  for (const el of wrap.querySelectorAll('.history-item')) {
    el.addEventListener('click', () => {
      const id = +el.dataset.id;
      const rec = loadHistory().find(r => r.id === id);
      if (rec) showResults(rec, { fromHistory: true });
    });
  }
}

// ===== Results overlay =====
function showResults(rec, opts = {}) {
  const pct = rec.total ? Math.round((rec.score / rec.total) * 100) : 0;
  const emoji = pct >= 90 ? '🏆' : pct >= 75 ? '🎉' : pct >= 50 ? '💪' : '🌱';
  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-title').textContent =
    opts.fromHistory ? 'תוצאות מבחן' : (pct === 100 ? 'מושלם!' : pct >= 75 ? 'כל הכבוד!' : 'סיימת');
  document.getElementById('r-score').textContent = String(rec.score);
  document.getElementById('r-total').textContent = String(rec.total);
  document.getElementById('r-pct').textContent = pct + '%';
  const topics = rec.topics.map(t => TOPIC_HEB[t] || t).join(' · ');
  document.getElementById('r-meta').textContent =
    `${LIMB_HEB[rec.limb] || rec.limb} · ${topics} · ${formatDate(rec.date)}`;

  const mSection = document.getElementById('r-mistakes-section');
  const mList = document.getElementById('r-mistakes-list');
  document.getElementById('r-mistakes-count').textContent = String(rec.mistakes.length);
  if (!rec.mistakes.length) {
    mSection.classList.add('empty');
    mList.innerHTML = '';
  } else {
    mSection.classList.remove('empty');
    mList.innerHTML = rec.mistakes.map(m => {
      const layerLabel = LAYER_LABELS[m.correctLayer] || '';
      const wrongLine = m.skipped
        ? `<div class="m-skipped">דילגת על השאלה</div>`
        : `<div class="m-wrong">לחצת על: <b>${m.pickedHeb || m.pickedLat || '—'}</b></div>`;
      return `<div class="mistake-item">
        <div class="m-correct">${m.correctHeb || m.correctLat} <span style="color:var(--ink-soft);font-weight:400">· ${layerLabel}</span></div>
        <div class="m-lat">${m.correctLat}</div>
        ${wrongLine}
      </div>`;
    }).join('');
  }

  // "Try again" only makes sense for an exam we just finished, not history.
  document.getElementById('results-again').textContent =
    opts.fromHistory ? 'מבחן חדש על אותם נושאים' : 'מבחן נוסף';
  document.getElementById('results-again').dataset.fromHistory = opts.fromHistory ? '1' : '';
  if (opts.fromHistory) {
    // Preload the topics/limb selection from the historical record.
    document.getElementById('results-again').dataset.limb = rec.limb;
    document.getElementById('results-again').dataset.topics = rec.topics.join(',');
  } else {
    delete document.getElementById('results-again').dataset.limb;
    delete document.getElementById('results-again').dataset.topics;
  }

  document.body.classList.add('show-results');
}

function hideResults() {
  document.body.classList.remove('show-results');
}

function syncLayerButtons() {
  for (const btn of document.querySelectorAll('#main-controls .seg-btn[data-layer]')) {
    btn.classList.toggle('on', !!layerState[btn.dataset.layer]);
  }
  const noneOn = !Object.values(layerState).some(Boolean);
  document.getElementById('start-exam').disabled = noneOn;
  document.getElementById('start-practice').disabled = noneOn;
}
function syncLimbTabs() {
  for (const btn of document.querySelectorAll('.tab[data-limb]')) {
    btn.classList.toggle('active', btn.dataset.limb === currentLimb);
  }
}

// ===== Main tabs (חקירה / תרגול / מבחן) =====
document.querySelectorAll('.m-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    setActiveTab(btn.dataset.tab);
  });
});

// ===== Limb tabs =====
document.querySelectorAll('.tab[data-limb]').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (btn.dataset.limb === currentLimb) return;
    currentLimb = btn.dataset.limb;
    syncLimbTabs();
    await loadLimb(currentLimb);
  });
});

// ===== Layer toggles (also serve as topic selection for exam/practice) =====
document.querySelectorAll('#main-controls .seg-btn[data-layer]').forEach(btn => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    layerState[layer] = !layerState[layer];
    syncLayerButtons();
    applyLayerVisibility();
    clearSelection();
    setInfoEmpty();
  });
});

// ===== Start exam / practice =====
document.getElementById('start-exam').addEventListener('click', () => {
  if (!Object.values(layerState).some(Boolean)) return;
  startExam();
});
document.getElementById('start-practice').addEventListener('click', () => {
  if (!Object.values(layerState).some(Boolean)) return;
  startPractice();
});

// ===== Exit exam back to learn mode =====
function exitExam() {
  exam = null;
  target = null;
  document.body.classList.remove('mode-practice');
  setMode('learn');
  clearSelection();
  setInfoEmpty();
  if (currentRoot) requestAnimationFrame(() => frameModel(currentRoot));
}
document.getElementById('back-to-overview').addEventListener('click', exitExam);

document.getElementById('skip').addEventListener('click', skipQuestion);
document.getElementById('reset-view').addEventListener('click', resetView);

// ===== Header history button =====
document.getElementById('header-history').addEventListener('click', () => {
  renderHistory();
  document.body.classList.add('show-history');
});
document.getElementById('history-close').addEventListener('click', () => {
  document.body.classList.remove('show-history');
});
document.getElementById('history-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'history-overlay') document.body.classList.remove('show-history');
});
document.getElementById('history-clear').addEventListener('click', () => {
  if (!confirm('למחוק את כל היסטוריית המבחנים?')) return;
  saveHistory([]);
  renderHistory();
});

// ===== Results overlay actions =====
document.getElementById('results-again').addEventListener('click', (e) => {
  hideResults();
  setActiveTab('exam');
  const btn = e.currentTarget;
  if (btn.dataset.fromHistory === '1') {
    const presetLimb = btn.dataset.limb;
    const presetTopics = (btn.dataset.topics || '').split(',').filter(Boolean);
    for (const k of Object.keys(layerState)) layerState[k] = presetTopics.includes(k);
    syncLayerButtons();
    if (presetLimb && presetLimb !== currentLimb) {
      currentLimb = presetLimb;
      syncLimbTabs();
      loadLimb(currentLimb).then(() => startExam());
      return;
    }
    applyLayerVisibility();
  }
  startExam();
});
document.getElementById('results-back').addEventListener('click', () => {
  hideResults();
  exitExam();
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(stage);

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// ===== Initial state =====
setMode('learn');
setActiveTab('overview');
syncLimbTabs();
syncLayerButtons();
loadLimb(currentLimb);
</script>
