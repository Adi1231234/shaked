<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060d" />
<title>שקד · גפיים 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --bg-0:#03050b;
    --ink:#e9f1ff;
    --ink-dim:#aab7d4;
    --ink-soft:#6b7a9a;
    --cyan:#7ee8ff;
    --cyan-deep:#3aa6ff;
    --rose:#ff5f8f;
    --rose-soft:#ff9bbf;
    --gold:#ffe6b3;
    --green:#5fffb0;
    --bone:#f3e9d1;
    --muscle:#d04060;
    --vein:#5a8fff;
  }
  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(126,232,255,0.08), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(255,95,143,0.10), transparent 60%),
      radial-gradient(140% 90% at 50% 0%, #0a1430 0%, #04070f 55%, #02030a 100%);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  /* Boot loader: cover entire UI until first GLB ready */
  .boot {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 50%, #060a18 0%, #03050b 70%);
    transition: opacity .8s ease, visibility .8s;
  }
  body.loaded .boot { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot-rings {
    position: relative;
    width: 160px; height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .boot-rings .ring {
    position: absolute;
    border: 1.5px solid;
    border-radius: 50%;
    width: 50px; height: 50px;
    animation: ring-expand 2.4s ease-out infinite;
    opacity: 0;
  }
  .boot-rings .ring.r1 { border-color: rgba(126,232,255,0.6); animation-delay: 0s; }
  .boot-rings .ring.r2 { border-color: rgba(255,155,191,0.55); animation-delay: 0.8s; }
  .boot-rings .ring.r3 { border-color: rgba(255,230,179,0.45); animation-delay: 1.6s; }
  @keyframes ring-expand {
    0%   { transform: scale(0.5); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .boot-heart {
    font-size: 44px;
    filter: drop-shadow(0 0 22px rgba(255,95,143,0.6));
    animation: heart-pulse 1.6s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes heart-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Hide app contents until loaded */
  body:not(.loaded) #app { opacity: 0; }
  #app { transition: opacity 0.6s ease 0.1s; }

  header {
    padding: max(env(safe-area-inset-top), 12px) 16px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .greeting { display: flex; flex-direction: column; line-height: 1.15; text-decoration: none; color: inherit; cursor: pointer; }
  .greeting:hover .hi { color: var(--cyan); }
  .greeting .hi { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; transition: color .2s; }
  .greeting .name {
    font-weight: 800;
    font-size: 21px;
    background: linear-gradient(120deg, var(--cyan), var(--rose-soft) 60%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .score {
    font-size: 12px;
    color: var(--ink-dim);
    background: rgba(126,232,255,0.06);
    border: 1px solid rgba(126,232,255,0.18);
    border-radius: 999px;
    padding: 5px 10px;
    display: none;
  }
  body.mode-quiz .score { display: inline-flex; gap: 6px; align-items: center; }
  .score b { color: var(--cyan); font-weight: 700; }

  nav.tabs { display: flex; gap: 6px; padding: 4px 16px 6px; }
  .tab {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--ink-dim);
    border-radius: 12px;
    padding: 8px 12px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all .25s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(126,232,255,0.14), rgba(58,166,255,0.10));
    border-color: rgba(126,232,255,0.35);
    color: var(--ink);
    box-shadow: 0 6px 20px -10px rgba(126,232,255,0.5);
  }

  .row { display: flex; gap: 6px; padding: 0 16px 6px; }
  .seg-btn {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 6px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg-btn .swatch {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .seg-btn.layer-bones.on { color: var(--bone); border-color: rgba(243,233,209,0.35); background: rgba(243,233,209,0.08); }
  .seg-btn.layer-muscles.on { color: var(--rose-soft); border-color: rgba(255,155,191,0.4); background: rgba(208,64,96,0.10); }
  .seg-btn.layer-veins.on { color: var(--vein); border-color: rgba(90,143,255,0.4); background: rgba(90,143,255,0.10); }
  .seg-btn.on .swatch { opacity: 1; box-shadow: 0 0 8px currentColor; }

  .mode-btn.active {
    background: rgba(255,95,143,0.10);
    border-color: rgba(255,95,143,0.32);
    color: var(--rose-soft);
  }

  .stage {
    flex: 1;
    position: relative;
    margin: 0 12px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(126,232,255,0.10);
    background:
      radial-gradient(80% 60% at 50% 30%, rgba(126,232,255,0.05), transparent 70%),
      linear-gradient(180deg, #060a17 0%, #03050b 100%);
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
    touch-action: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 14px;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .loader.hide { opacity: 0; }
  .pulse {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(126,232,255,0.6), transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
    margin-inline-end: 12px;
  }
  @keyframes pulse {
    0%,100% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  .hint {
    position: absolute; bottom: 10px; right: 10px; left: 10px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 11px;
    pointer-events: none;
    opacity: 0.7;
  }

  .quiz-prompt {
    position: absolute;
    top: 10px; right: 10px; left: 10px;
    background: rgba(7,11,28,0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,95,143,0.25);
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    font-size: 14px;
    display: none;
  }
  body.mode-quiz .quiz-prompt { display: block; }
  .quiz-prompt .ask { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.05em; }
  .quiz-prompt .target { color: var(--rose-soft); font-weight: 500; font-size: 16px; margin-top: 1px; }
  .quiz-prompt .target em { font-style: normal; color: var(--ink); font-size: 13px; opacity: 0.85; }

  .feedback {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    transition: box-shadow .3s ease;
  }
  .feedback.correct { box-shadow: inset 0 0 0 3px var(--green), inset 0 0 80px rgba(95,255,176,0.2); }
  .feedback.wrong { box-shadow: inset 0 0 0 3px var(--rose), inset 0 0 80px rgba(255,95,143,0.2); }

  .info {
    margin: 8px 12px max(env(safe-area-inset-bottom), 10px);
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(126,232,255,0.06), rgba(255,95,143,0.04));
    border: 1px solid rgba(126,232,255,0.15);
    border-radius: 16px;
    min-height: 84px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color .3s ease, background .3s ease;
  }
  .info.empty { opacity: 0.6; }
  .info-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink-soft);
    flex-shrink: 0;
    transition: background .25s ease, box-shadow .25s ease;
  }
  .info[data-layer="Bones"] {
    border-color: rgba(243,233,209,0.28);
    background: linear-gradient(135deg, rgba(243,233,209,0.08), rgba(255,255,255,0.02));
  }
  .info[data-layer="Bones"] .info-dot {
    background: var(--bone);
    box-shadow: 0 0 16px rgba(243,233,209,0.7);
  }
  .info[data-layer="Muscles"] {
    border-color: rgba(255,155,191,0.32);
    background: linear-gradient(135deg, rgba(208,64,96,0.10), rgba(255,255,255,0.02));
  }
  .info[data-layer="Muscles"] .info-dot {
    background: var(--rose-soft);
    box-shadow: 0 0 16px rgba(255,155,191,0.7);
  }
  .info[data-layer="Veins"] {
    border-color: rgba(90,143,255,0.36);
    background: linear-gradient(135deg, rgba(90,143,255,0.10), rgba(255,255,255,0.02));
  }
  .info[data-layer="Veins"] .info-dot {
    background: var(--vein);
    box-shadow: 0 0 16px rgba(90,143,255,0.7);
  }
  .info-text { flex: 1; min-width: 0; }
  .info .primary {
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: 0.01em;
    direction: ltr;
    text-align: right;       /* in our RTL container, right = visual start */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .info.empty .primary {
    direction: rtl;
    font-weight: 400;
    font-size: 14px;
    color: var(--ink-dim);
    white-space: normal;
  }
  .info .secondary {
    font-size: 14px;
    color: var(--cyan);
    margin-top: 4px;
    font-weight: 500;
  }
  .info .desc {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 4px;
    line-height: 1.45;
  }
  .skip {
    background: rgba(255,95,143,0.10);
    border: 1px solid rgba(255,95,143,0.3);
    color: var(--rose-soft);
    border-radius: 10px;
    padding: 7px 11px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    display: none;
  }
  body.mode-quiz .skip { display: block; }

  .confetti { position: absolute; pointer-events: none; font-size: 22px; animation: fall 1.4s ease-out forwards; }
  @keyframes fall {
    0% { transform: translate(0,-10px) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx,0), 200px) rotate(var(--r,720deg)); opacity: 0; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="boot-heart">💜</div>
  </div>
</div>

<div id="app">
  <header>
    <a class="greeting" href="./index.html">
      <span class="hi">← חזרה</span>
      <span class="name">שקד 💜</span>
    </a>
    <div class="score" id="score">ניקוד <b id="score-num">0</b> / <span id="score-total">0</span></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-limb="legs">רגל</button>
    <button class="tab" data-limb="arms">יד</button>
  </nav>

  <div class="row">
    <button class="seg-btn layer-bones on" data-layer="Bones"><span class="swatch"></span>עצמות</button>
    <button class="seg-btn layer-muscles" data-layer="Muscles"><span class="swatch"></span>שרירים</button>
    <button class="seg-btn layer-veins" data-layer="Veins"><span class="swatch"></span>ורידים</button>
  </div>

  <div class="row">
    <button class="seg-btn mode-btn active" data-mode="learn">למידה</button>
    <button class="seg-btn mode-btn" data-mode="quiz">חידון</button>
  </div>

  <div class="stage" id="stage">
    <div class="loader" id="loader"><div class="pulse"></div>טוען מודל…</div>
    <div class="quiz-prompt" id="prompt">
      <div class="ask" id="ask">איפה נמצא</div>
      <div class="target" id="target">—</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="hint">גרור לסיבוב · גלגלת/צביטה לזום · לחצי על מבנה</div>
  </div>

  <div class="info empty" id="info">
    <div class="info-dot"></div>
    <div class="info-text">
      <div class="primary" id="info-primary">לחצי על מבנה כדי לראות את שמו</div>
      <div class="secondary" id="info-secondary"></div>
      <div class="desc" id="info-desc"></div>
    </div>
    <button class="skip" id="skip">דלגי ←</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
// Dictionary: original glTF node name -> { heb, lat, desc? }
// Layer is derived from the GLB's top-level group at runtime.
// Items not in this dict still get clicked; they show their Latin name.
// =====================================================================
const STRUCTURES = {
  // ===== LEG BONES =====
  'Femur.r':                              { heb: 'עצם הירך', lat: 'Femur', desc: 'העצם הארוכה והחזקה ביותר בגוף' },

  'Cuboid bone.r':                        { heb: 'העצם הקובית', lat: 'Os cuboideum' },
  'Medial cuneiform bone.r':              { heb: 'הטרזית התיכונה', lat: 'Cuneiforme mediale' },

  'Fibularis longus muscle.r':         { heb: 'שוקיתי ארוך', lat: 'Peroneus longus' },
  'Fibularis brevis muscle.r':         { heb: 'שוקיתי קצר', lat: 'Peroneus brevis' },
  'Fibularis tertius muscle.r':        { heb: 'שוקיתי שלישוני', lat: 'Peroneus tertius' },

function infoFor(nodeName, layer) {
  const s = STRUCTURES[nodeName];
  if (s) return { heb: s.heb, lat: s.lat, desc: s.desc, layer };
  // Fallback: nodeName without trailing .r, prefer Latin display only
  const lat = nodeName.replace(/\.r$/, '').replace(/_/g, ' ');
  return { heb: '', lat, desc: '', layer };
}

async function loadLimb(name) {
  if (currentRoot) { scene.remove(currentRoot); currentRoot = null; }
  pickables = [];
  layerNodes = {};
  selected = null;
  loader.classList.remove('hide');

  let gltf = cache[name];
  if (!gltf) {
    gltf = await gltfLoader.loadAsync(`./models/${name}.glb`);
    cache[name] = gltf;
  }
  currentRoot = gltf.scene.clone(true);

  // Identify the three top-level layer groups by name
  for (const child of currentRoot.children) {
    if (LAYER_COLORS[child.name]) layerNodes[child.name] = child;
  }

  // Walk every mesh, give it a per-mesh material and tag with layer + node identity
  for (const [layerName, layerNode] of Object.entries(layerNodes)) {
    const lc = LAYER_COLORS[layerName];
    layerNode.traverse((obj) => {
      if (!obj.isMesh) return;

      // Identify this mesh's bone/muscle/vein name
      let nodeName = null;
      for (let n = obj; n && n !== layerNode; n = n.parent) {
        const orig = SANITIZED_TO_ORIG[n.name];
        if (orig) { nodeName = orig; break; }
      }
      if (!nodeName) {
        // No dictionary entry: still pickable, derive name from sanitized parent
        let n = obj;
        while (n && n !== layerNode && !n.name) n = n.parent;
        nodeName = n?.name || obj.name || 'unknown';
      }

      // Per-mesh material so highlighting is local
      obj.material = obj.material.clone();
      obj.material.color = new THREE.Color(lc.color);
      if ('roughness' in obj.material) obj.material.roughness = lc.roughness;
      if ('metalness' in obj.material) obj.material.metalness = lc.metalness;
      obj.material.transparent = lc.opacity < 1;
      obj.material.opacity = lc.opacity;
      obj.material.depthWrite = lc.opacity >= 0.99;
      obj.material.emissive = new THREE.Color(0x000000);

      pickables.push({
        mesh: obj,
        nodeName,
        layer: layerName,
        info: infoFor(nodeName, layerName),
        originalEmissive: obj.material.emissive.clone(),
      });
    });
  }

  scene.add(currentRoot);
  applyLayerVisibility();
  frameModel(currentRoot);
  loader.classList.add('hide');
  reveal();
  setInfoEmpty();
  if (mode === 'quiz') nextQuestion();
}

const bootStart = performance.now();
const MIN_BOOT_MS = 700;
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  const wait = Math.max(0, MIN_BOOT_MS - (performance.now() - bootStart));
  setTimeout(() => document.body.classList.add('loaded'), wait);
}

function frameModel(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.4;
  camera.position.set(0, 0, dist);
  controls.target.set(0, 0, 0);
  controls.update();
}

// =====================================================================
// Picking — fuzzy raycast so a fat fingertip lands on thin bones.
// First try the exact tap point. If nothing is hit, fan out a ring of
// extra rays at ~22px radius and pick the nearest hit by 2D pixel
// distance from the original tap.
// =====================================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

const PICK_RADIUS_PX = 22;
const PICK_RING = (() => {
  // 1 center + 8 directions at 1x radius + 8 directions at 0.55x radius
  const out = [[0, 0]];
  const dirs = 8;
  for (const r of [1.0, 0.55]) {
    for (let i = 0; i < dirs; i++) {
      const a = (i / dirs) * Math.PI * 2;
      out.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
  }
  return out;
})();

function pickFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const visibleMeshes = pickables.filter(p => layerNodes[p.layer]?.visible).map(p => p.mesh);
  if (!visibleMeshes.length) return null;

  let bestPick = null;
  let bestPenalty = Infinity;
  for (let i = 0; i < PICK_RING.length; i++) {
    const [ox, oy] = PICK_RING[i];
    const px = cx + ox * PICK_RADIUS_PX;
    const py = cy + oy * PICK_RADIUS_PX;
    const x = (px / rect.width) * 2 - 1;
    const y = -((py / rect.height) * 2 - 1);
    ndc.set(x, y);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(visibleMeshes, false);
    if (!hits.length) continue;
    const offsetPx2 = (ox * PICK_RADIUS_PX) ** 2 + (oy * PICK_RADIUS_PX) ** 2;
    if (i === 0) {
      // Exact center hit always wins.
      return pickables.find(p => p.mesh === hits[0].object) || null;
    }
    if (offsetPx2 < bestPenalty) {
      bestPenalty = offsetPx2;
      bestPick = hits[0].object;
    }
  }
  return bestPick ? (pickables.find(p => p.mesh === bestPick) || null) : null;
}

let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (Math.hypot(dx, dy) > 12) return;
  const picked = pickFromEvent(e);
  if (!picked) {
    if (mode === 'learn') { clearSelection(); setInfoEmpty(); }
    return;
  }
  if (mode === 'learn') {
    setSelection(picked);
    showInfo(picked);
  } else {
    answerQuestion(picked);
  }
});

function applyLayerVisibility() {

function quizPool() {
  const visible = Object.keys(layerState).filter(l => layerState[l]);
  return pickables.filter(p => visible.includes(p.layer) && p.info.heb);
}
function askPrefix(layer) {
  return layer === 'Veins' ? 'איפה נמצא הוריד' : layer === 'Muscles' ? 'איפה נמצא השריר' : 'איפה נמצאת העצם';
}
function nextQuestion() {
  clearSelection();
  const pool = quizPool();
  if (!pool.length) {
    askEl.textContent = '';
    targetEl.innerHTML = '<em>הפעילי שכבה כדי להתחיל</em>';
    target = null;
    return;
  }
  let pick;
  do { pick = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && pick === target);
  target = pick;
  askEl.textContent = askPrefix(target.layer);
  targetEl.innerHTML = `${target.info.lat} <em>· ${target.info.heb}</em>`;
  setInfoEmpty();
}

  feedbackEl.classList.remove('correct','wrong');
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add(kind);
  setTimeout(() => feedbackEl.classList.remove(kind), 600);
}
function confettiBurst() {
  const emojis = ['💜','✨','💫','🦴','💖'];
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = (10 + Math.random()*80) + '%';
    el.style.top = (20 + Math.random()*30) + '%';
    el.style.setProperty('--dx', (Math.random()*120 - 60) + 'px');
    el.style.setProperty('--r', (Math.random()*900 - 450) + 'deg');
    el.style.animationDelay = (Math.random()*0.2) + 's';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}
function answerQuestion(picked) {
  if (!target) return;
  total++;
  if (picked === target) {
    score++;
    setSelection(picked, CORRECT_COLOR);
    showInfo(picked);
    flash('correct');
    confettiBurst();
    setTimeout(nextQuestion, 1100);
  } else {
    setSelection(picked, WRONG_COLOR);
    flash('wrong');
    setTimeout(() => {
      setSelection(target, CORRECT_COLOR);
      showInfo(target);
    }, 600);
    setTimeout(nextQuestion, 1900);
  }
  scoreNum.textContent = score;
  scoreTotal.textContent = total;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.limb === currentLimb) return;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    currentLimb = btn.dataset.limb;
    loadLimb(currentLimb);
  });
});
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === mode) return;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    mode = btn.dataset.mode;
    document.body.classList.toggle('mode-quiz', mode === 'quiz');
    score = 0; total = 0;
    scoreNum.textContent = 0; scoreTotal.textContent = 0;
    clearSelection();
    setInfoEmpty();
    if (mode === 'quiz') nextQuestion();
  });
});
document.querySelectorAll('.seg-btn[data-layer]').forEach(btn => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    layerState[layer] = !layerState[layer];
    btn.classList.toggle('on', layerState[layer]);
    applyLayerVisibility();
    if (mode === 'quiz') nextQuestion();
    else { clearSelection(); setInfoEmpty(); }
  });
});
document.getElementById('skip').addEventListener('click', nextQuestion);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(stage);

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

loadLimb(currentLimb);
</script>
</body>
</html>
